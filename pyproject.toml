[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frontier"
version = "0.1.0"
description = "Risk-controlled instance-adaptive prompt compression research system"
requires-python = ">=3.11"
dependencies = [
  "hydra-core>=1.3,<2",
  "numpy>=1.26,<2",
  "pyarrow>=15,<20",
  "pandas>=2.0,<3",
  "structlog>=24,<26",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
frontier-validate = "frontier.corpus.validate:main"
frontier-features = "frontier.features.registry:main"
frontier-train = "frontier.predict.train:main"
frontier-crc-report = "scripts.07_crc_report:main"
frontier-eval = "frontier.eval.cli:main"
frontier-p10 = "frontier.eval.p10:generate_reports"

[tool.hatch.build.targets.wheel]
packages = ["frontier"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
